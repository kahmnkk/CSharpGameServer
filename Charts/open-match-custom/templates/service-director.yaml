apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-match-director.name" . }}
  labels:
    {{- include "open-match-director.labels" . | nindent 4 }}
spec:
  type: {{ .Values.director.service.type }}
  ports:
    - port: {{ .Values.director.service.grpc.port }}
      protocol: TCP
      name: grpc
    - port: {{ .Values.director.service.http.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "open-match-director.selectorLabels" . | nindent 4 }}
